---
- name: Assert fapolicyd_add_trusted_file is a string or list of strings
  ansible.builtin.assert:
    that:
      - >-
        fapolicyd_add_trusted_file is string
        or (fapolicyd_add_trusted_file is sequence
            and fapolicyd_add_trusted_file is not string
            and fapolicyd_add_trusted_file is not mapping
            and fapolicyd_add_trusted_file | reject('string') | list
            | length == 0)
    fail_msg: >-
      fapolicyd_add_trusted_file must be a string or list of strings,
      got {{ fapolicyd_add_trusted_file | type_debug }}
  when: fapolicyd_add_trusted_file is not none

- name: Assert fapolicyd_add_trusted_paths is a string or list of strings
  ansible.builtin.assert:
    that:
      - >-
        fapolicyd_add_trusted_paths is string
        or (fapolicyd_add_trusted_paths is sequence
            and fapolicyd_add_trusted_paths is not string
            and fapolicyd_add_trusted_paths is not mapping
            and fapolicyd_add_trusted_paths | reject('string') | list
            | length == 0)
    fail_msg: >-
      fapolicyd_add_trusted_paths must be a string or list of strings,
      got {{ fapolicyd_add_trusted_paths | type_debug }}
  when: fapolicyd_add_trusted_paths is not none

- name: Assert fapolicyd_setup_watch_fs is a list of strings
  ansible.builtin.assert:
    that:
      - >-
          fapolicyd_setup_watch_fs
          and fapolicyd_setup_watch_fs is sequence
          and fapolicyd_setup_watch_fs is not string
          and fapolicyd_setup_watch_fs is not mapping
          and fapolicyd_setup_watch_fs | reject('string') | list
          | length == 0
    fail_msg: >-
      fapolicyd_setup_watch_fs must be a list of strings,
      got {{ fapolicyd_setup_watch_fs | type_debug }}

- name: Assert fapolicyd_rules_files items have content when present
  ansible.builtin.assert:
    that:
      - item.content is defined
    fail_msg: >-
      fapolicyd_rules_files item {{ item.name }} must have content defined
      when state is present
  loop: "{{ fapolicyd_rules_files }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.state | d('present') == 'present'
