# SPDX-License-Identifier: MIT
---
- name: Verify invalid parameters are rejected
  hosts: all
  vars:
    __invalid_input_failure_messages: >-
      {{ ([ansible_failed_result.msg | default(''),
           ansible_failed_result.msg.msg | default('')]
          + (ansible_failed_result.results | default([])
             | map(attribute='msg') | map('default', '') | list))
         | join(' ') }}
  tasks:
    - name: Run invalid input tests
      block:
        # ====================================================
        # Section 1: Verify role works with valid defaults
        # ====================================================
        - name: Run role with valid defaults
          ansible.builtin.include_role:
            name: linux-system-roles.fapolicyd

        # ====================================================
        # Section 2: argument_specs validation (Ansible 2.10+)
        # ====================================================
        - name: Run argument specs validation tests
          when: ansible_version.full is version("2.10", ">=")
          block:
            # --- Test: non-boolean fapolicyd_setup_enable_service ---
            - name: Argument specs reject non-bool enable_service
              block:
                - name: Run role with non-bool enable_service
                  ansible.builtin.include_role:
                    name: linux-system-roles.fapolicyd
                  vars:
                    fapolicyd_setup_enable_service: "not_a_bool"
              rescue:
                - name: Mark invalid enable_service type rejected
                  ansible.builtin.set_fact:
                    __invalid_input_enable_service_type_failed: true
                  when: >-
                    "argument 'fapolicyd_setup_enable_service' is of type" in
                    __invalid_input_failure_messages and
                    'we were unable to convert to bool' in
                    __invalid_input_failure_messages

            - name: Assert invalid enable_service type was rejected
              ansible.builtin.assert:
                that:
                  - >-
                    __invalid_input_enable_service_type_failed
                    | default(false)
                fail_msg: >-
                  argument_specs should reject fapolicyd_setup_enable_service
                  with a non-boolean value

            # --- Test: invalid fapolicyd_setup_integrity choice ---
            - name: Argument specs reject invalid integrity choice
              block:
                - name: Run role with invalid integrity value
                  ansible.builtin.include_role:
                    name: linux-system-roles.fapolicyd
                  vars:
                    fapolicyd_setup_integrity: invalid_integrity
              rescue:
                - name: Mark invalid integrity choice rejected
                  ansible.builtin.set_fact:
                    __invalid_input_integrity_choice_failed: true
                  when: >-
                    'value of fapolicyd_setup_integrity must be one of:' in
                    __invalid_input_failure_messages and
                    'got: invalid_integrity' in
                    __invalid_input_failure_messages

            - name: Assert invalid integrity choice was rejected
              ansible.builtin.assert:
                that:
                  - >-
                    __invalid_input_integrity_choice_failed
                    | default(false)
                fail_msg: >-
                  argument_specs should reject fapolicyd_setup_integrity
                  with an invalid choice value

            # --- Test: non-boolean fapolicyd_setup_permissive ---
            - name: Argument specs reject non-bool permissive
              block:
                - name: Run role with non-bool permissive
                  ansible.builtin.include_role:
                    name: linux-system-roles.fapolicyd
                  vars:
                    fapolicyd_setup_permissive: "not_a_bool"
              rescue:
                - name: Mark invalid permissive type rejected
                  ansible.builtin.set_fact:
                    __invalid_input_permissive_type_failed: true
                  when: >-
                    "argument 'fapolicyd_setup_permissive' is of type" in
                    __invalid_input_failure_messages and
                    'we were unable to convert to bool' in
                    __invalid_input_failure_messages

            - name: Assert invalid permissive type was rejected
              ansible.builtin.assert:
                that:
                  - >-
                    __invalid_input_permissive_type_failed
                    | default(false)
                fail_msg: >-
                  argument_specs should reject fapolicyd_setup_permissive
                  with a non-boolean value

        # ====================================================
        # Section 3: assert_role_vars validation (all versions)
        # ====================================================

        # --- Test: fapolicyd_setup_watch_fs as integer ---
        - name: Assert rejects watch_fs as integer
          block:
            - name: Run role with integer watch_fs
              ansible.builtin.include_role:
                name: linux-system-roles.fapolicyd
              vars:
                fapolicyd_setup_watch_fs: 123
          rescue:
            - name: Mark watch_fs integer rejected
              ansible.builtin.set_fact:
                __invalid_input_watch_fs_int_failed: true
              when: >-
                'fapolicyd_setup_watch_fs must be a list of strings, got int'
                in __invalid_input_failure_messages

        - name: Assert watch_fs as integer was rejected
          ansible.builtin.assert:
            that:
              - >-
                __invalid_input_watch_fs_int_failed
                | default(false)
            fail_msg: >-
              assert_role_vars should reject fapolicyd_setup_watch_fs
              when given an integer value

        # --- Test: fapolicyd_setup_watch_fs as list of non-strings ---
        - name: Assert rejects watch_fs as list of non-strings
          block:
            - name: Run role with list of integers for watch_fs
              ansible.builtin.include_role:
                name: linux-system-roles.fapolicyd
              vars:
                fapolicyd_setup_watch_fs:
                  - 123
                  - 456
          rescue:
            - name: Mark watch_fs non-string list rejected
              ansible.builtin.set_fact:
                __invalid_input_watch_fs_list_failed: true
              when: >-
                'fapolicyd_setup_watch_fs must be a list of strings, got list'
                in __invalid_input_failure_messages

        - name: Assert watch_fs as list of non-strings was rejected
          ansible.builtin.assert:
            that:
              - >-
                __invalid_input_watch_fs_list_failed
                | default(false)
            fail_msg: >-
              assert_role_vars should reject fapolicyd_setup_watch_fs
              when given a list containing non-string elements

        # --- Test: fapolicyd_setup_watch_fs as dict ---
        - name: Assert rejects watch_fs as dict
          block:
            - name: Run role with dict for watch_fs
              ansible.builtin.include_role:
                name: linux-system-roles.fapolicyd
              vars:
                fapolicyd_setup_watch_fs:
                  key: val
          rescue:
            - name: Mark watch_fs dict rejected
              ansible.builtin.set_fact:
                __invalid_input_watch_fs_dict_failed: true
              when: >-
                (
                  "argument 'fapolicyd_setup_watch_fs' is of type" in
                  __invalid_input_failure_messages and
                  'we were unable to convert to list' in
                  __invalid_input_failure_messages
                ) or (
                  'fapolicyd_setup_watch_fs must be a list of strings, got dict'
                  in __invalid_input_failure_messages
                )

        - name: Assert watch_fs as dict was rejected
          ansible.builtin.assert:
            that:
              - >-
                __invalid_input_watch_fs_dict_failed
                | default(false)
            fail_msg: >-
              assert_role_vars should reject fapolicyd_setup_watch_fs
              when given a dictionary value

        # --- Test: fapolicyd_setup_watch_fs as boolean ---
        - name: Assert rejects watch_fs as boolean
          block:
            - name: Run role with boolean for watch_fs
              ansible.builtin.include_role:
                name: linux-system-roles.fapolicyd
              vars:
                fapolicyd_setup_watch_fs: true
          rescue:
            - name: Mark watch_fs boolean rejected
              ansible.builtin.set_fact:
                __invalid_input_watch_fs_bool_failed: true
              when: >-
                'fapolicyd_setup_watch_fs must be a list of strings, got bool'
                in __invalid_input_failure_messages

        - name: Assert watch_fs as boolean was rejected
          ansible.builtin.assert:
            that:
              - >-
                __invalid_input_watch_fs_bool_failed
                | default(false)
            fail_msg: >-
              assert_role_vars should reject fapolicyd_setup_watch_fs
              when given a boolean value

        # --- Test: fapolicyd_add_trusted_file as integer ---
        - name: Assert rejects trusted_file as integer
          block:
            - name: Run role with integer trusted_file
              ansible.builtin.include_role:
                name: linux-system-roles.fapolicyd
              vars:
                fapolicyd_add_trusted_file: 123
          rescue:
            - name: Mark trusted_file integer rejected
              ansible.builtin.set_fact:
                __invalid_input_trusted_file_int_failed: true
              when: >-
                'fapolicyd_add_trusted_file must be a string or list of strings, got int'
                in __invalid_input_failure_messages

        - name: Assert trusted_file as integer was rejected
          ansible.builtin.assert:
            that:
              - >-
                __invalid_input_trusted_file_int_failed
                | default(false)
            fail_msg: >-
              assert_role_vars should reject fapolicyd_add_trusted_file
              when given an integer value

        # --- Test: fapolicyd_add_trusted_paths as integer ---
        - name: Assert rejects trusted_paths as integer
          block:
            - name: Run role with integer trusted_paths
              ansible.builtin.include_role:
                name: linux-system-roles.fapolicyd
              vars:
                fapolicyd_add_trusted_paths: 123
          rescue:
            - name: Mark trusted_paths integer rejected
              ansible.builtin.set_fact:
                __invalid_input_trusted_paths_int_failed: true
              when: >-
                'fapolicyd_add_trusted_paths must be a string or list of strings, got int'
                in __invalid_input_failure_messages

        - name: Assert trusted_paths as integer was rejected
          ansible.builtin.assert:
            that:
              - >-
                __invalid_input_trusted_paths_int_failed
                | default(false)
            fail_msg: >-
              assert_role_vars should reject fapolicyd_add_trusted_paths
              when given an integer value

        # --- Test: fapolicyd_add_trusted_file as list of non-strings ---
        - name: Assert rejects trusted_file as list of non-strings
          block:
            - name: Run role with list of integers for trusted_file
              ansible.builtin.include_role:
                name: linux-system-roles.fapolicyd
              vars:
                fapolicyd_add_trusted_file:
                  - 123
                  - 456
          rescue:
            - name: Mark trusted_file non-string list rejected
              ansible.builtin.set_fact:
                __invalid_input_trusted_file_list_failed: true
              when: >-
                'fapolicyd_add_trusted_file must be a string or list of strings, got list'
                in __invalid_input_failure_messages

        - name: Assert trusted_file as list of non-strings was rejected
          ansible.builtin.assert:
            that:
              - >-
                __invalid_input_trusted_file_list_failed
                | default(false)
            fail_msg: >-
              assert_role_vars should reject fapolicyd_add_trusted_file
              when given a list containing non-string elements

        # --- Test: fapolicyd_add_trusted_file as dict ---
        - name: Assert rejects trusted_file as dict
          block:
            - name: Run role with dict for trusted_file
              ansible.builtin.include_role:
                name: linux-system-roles.fapolicyd
              vars:
                fapolicyd_add_trusted_file:
                  key: val
          rescue:
            - name: Mark trusted_file dict rejected
              ansible.builtin.set_fact:
                __invalid_input_trusted_file_dict_failed: true
              when: >-
                'fapolicyd_add_trusted_file must be a string or list of strings, got dict'
                in __invalid_input_failure_messages

        - name: Assert trusted_file as dict was rejected
          ansible.builtin.assert:
            that:
              - >-
                __invalid_input_trusted_file_dict_failed
                | default(false)
            fail_msg: >-
              assert_role_vars should reject fapolicyd_add_trusted_file
              when given a dictionary value

        # --- Test: fapolicyd_add_trusted_file as boolean ---
        - name: Assert rejects trusted_file as boolean
          block:
            - name: Run role with boolean for trusted_file
              ansible.builtin.include_role:
                name: linux-system-roles.fapolicyd
              vars:
                fapolicyd_add_trusted_file: true
          rescue:
            - name: Mark trusted_file boolean rejected
              ansible.builtin.set_fact:
                __invalid_input_trusted_file_bool_failed: true
              when: >-
                'fapolicyd_add_trusted_file must be a string or list of strings, got bool'
                in __invalid_input_failure_messages

        - name: Assert trusted_file as boolean was rejected
          ansible.builtin.assert:
            that:
              - >-
                __invalid_input_trusted_file_bool_failed
                | default(false)
            fail_msg: >-
              assert_role_vars should reject fapolicyd_add_trusted_file
              when given a boolean value

        # --- Test: fapolicyd_rules_files with an invalid rule ---
        # Assisted by Claude Code using model(s) Claude Opus 5.5
        - name: Get installed fapolicyd version
          ansible.builtin.package_facts:
          no_log: "{{ ansible_verbosity < 3 }}"

        # the role checks rules only on fapolicyd 1.5 or later
        - name: Run invalid rule tests
          when: ansible_facts.packages['fapolicyd'][0].version is
            version('1.5', '>=')
          block:
            # 75-test-lang uses a set defined in 10-languages.rules
            - name: Run role with valid rules
              ansible.builtin.include_role:
                name: linux-system-roles.fapolicyd
              vars:
                fapolicyd_rules_files:
                  - name: 05-test-invalid
                    content: |
                      deny perm=execute all : path=/nonexistent/fapolicyd-test
                  - name: 75-test-lang
                    content: |
                      allow perm=open all : ftype=%languages trust=1

            - name: Role rejects an invalid rule without writing files
              block:
                - name: Run role with an invalid rule
                  ansible.builtin.include_role:
                    name: linux-system-roles.fapolicyd
                  vars:
                    fapolicyd_rules_files:
                      - name: 05-test-invalid
                        content: |
                          this is not a rule
                      - name: 06-test-new
                        content: |
                          deny perm=execute all : path=/nonexistent/fapolicyd-test
              rescue:
                - name: Get existing rules file content
                  ansible.builtin.slurp:
                    src: /etc/fapolicyd/rules.d/05-test-invalid.rules
                  register: __invalid_input_rules_file_content

                - name: Get new rules file status
                  ansible.builtin.stat:
                    path: /etc/fapolicyd/rules.d/06-test-new.rules
                  register: __invalid_input_rules_file_new

                - name: Mark invalid rule rejected
                  ansible.builtin.set_fact:
                    __invalid_input_rules_file_failed: true
                  when: >-
                    ansible_failed_result.cmd | default('') | string
                    is search('check-rules') and
                    __invalid_input_rules_file_content.content | b64decode
                    is search('/nonexistent/fapolicyd-test') and
                    not __invalid_input_rules_file_new.stat.exists

            - name: Assert invalid rule was rejected and no files written
              ansible.builtin.assert:
                that:
                  - >-
                    __invalid_input_rules_file_failed
                    | default(false)
                fail_msg: >-
                  the role should reject an invalid rule in
                  fapolicyd_rules_files without writing the rules files

      always:
        - name: Clear test facts
          ansible.builtin.set_fact:
            __invalid_input_enable_service_type_failed:
            __invalid_input_integrity_choice_failed:
            __invalid_input_permissive_type_failed:
            __invalid_input_trusted_file_int_failed:
            __invalid_input_trusted_paths_int_failed:
            __invalid_input_trusted_file_list_failed:
            __invalid_input_trusted_file_dict_failed:
            __invalid_input_trusted_file_bool_failed:
            __invalid_input_watch_fs_int_failed:
            __invalid_input_watch_fs_list_failed:
            __invalid_input_watch_fs_dict_failed:
            __invalid_input_watch_fs_bool_failed:
            __invalid_input_rules_file_failed:
          tags: tests::cleanup

        - name: Remove test rules files
          ansible.builtin.file:
            path: /etc/fapolicyd/rules.d/{{ item }}.rules
            state: absent
          loop:
            - 05-test-invalid
            - 06-test-new
            - 75-test-lang
          tags: tests::cleanup
